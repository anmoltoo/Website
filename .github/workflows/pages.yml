# Publishes the log website (index.html and assets/) to GitHub Pages on every push to the default
# branch that touches the site, or by hand from the Actions tab. The desktop app in app/ is not published.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [ccr-e3f29965-5zgbeq]
    paths:
      - index.html
      - assets/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect the site files
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r assets _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
